name: Preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker (false replaces the preview for cleanup)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: rig-preview-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.34.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm typecheck
      - name: Export single-file preview
        env:
          INCLUDE_MARKER: ${{ inputs.include_marker }}
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
        run: |
          if [[ "$INCLUDE_MARKER" == true && -z "$LANE_MARKER" ]]; then
            echo 'Initial preview requires a nonempty LANE_MARKER secret.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rig-preview"
          scripts/export-preview.sh "$RUNNER_TEMP/rig-preview/index.html"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        id: upload
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
      - name: Delete this run's temporary Pages artifact
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
